name: Generar i publicar les 800 icones Tabler
on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "config/selection.json"
      - "config/theme.json"
      - "package.json"
      - "requirements.txt"
      - "docs/index.html"
      - ".github/workflows/build-and-publish.yml"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: f-tabler-icons-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositori
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instal·lar Tabler
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Instal·lar CairoSVG i Pillow
        run: pip install -r requirements.txt
      - name: Generar SVG i PNG circulars
        run: python scripts/build.py
      - name: Validar els 3200 fitxers
        run: python scripts/validate.py
      - name: Desar la biblioteca generada a GitHub
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets docs/data/catalog.json config/selected-icons.txt
          if ! git diff --cached --quiet; then
            git commit -m "Genera 600 icones Tabler en blau i coral"
            git push
          fi
      - name: Preparar catàleg per a Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./docs"
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Publicar catàleg
        uses: actions/deploy-pages@v4
